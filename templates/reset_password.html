{% extends "base.html" %}
{% block title %}Reset Password - AI Interview Coach{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="auth-card">
          <div class="text-center mb-4">
            <div class="auth-logo mb-3" style="background:rgba(16,185,129,0.12);color:#10b981;">
              <i class="bi bi-lock-fill"></i>
            </div>
            <h2 class="fw-bold">Set New Password</h2>
            <p class="text-muted">Create a strong new password for your account</p>
          </div>

          <form method="POST">
            <div class="mb-3">
              <label class="form-label fw-semibold">New Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control" name="password" id="newPass" placeholder="Min 6 characters" required minlength="6" />
                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('newPass', 'eyeNew')">
                  <i class="bi bi-eye" id="eyeNew"></i>
                </button>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Confirm New Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill text-muted"></i></span>
                <input type="password" class="form-control" name="confirm_password" id="confirmNew" placeholder="Repeat new password" required />
                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirmNew', 'eyeConfirmNew')">
                  <i class="bi bi-eye" id="eyeConfirmNew"></i>
                </button>
              </div>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-success btn-lg rounded-3 fw-semibold">
                <i class="bi bi-check-circle me-2"></i>Reset Password
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
