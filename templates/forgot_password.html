{% extends "base.html" %}
{% block title %}Forgot Password - AI Interview Coach{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="auth-card">
          <div class="text-center mb-4">
            <div class="auth-logo mb-3" style="background:rgba(255,193,7,0.12);color:#f59e0b;">
              <i class="bi bi-key-fill"></i>
            </div>
            <h2 class="fw-bold">Forgot Password</h2>
            <p class="text-muted">Enter your email to receive a reset OTP</p>
          </div>

          <form method="POST">
            <div class="mb-4">
              <label class="form-label fw-semibold">Registered Email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control" name="email" placeholder="your@email.com" required />
              </div>
            </div>

            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-warning btn-lg rounded-3 fw-semibold text-white">
                <i class="bi bi-send me-2"></i>Send Reset OTP
              </button>
            </div>
          </form>

          <div class="text-center text-muted small">
            Remembered your password?
            <a href="{{ url_for('login') }}" class="text-primary fw-semibold">Login here</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
